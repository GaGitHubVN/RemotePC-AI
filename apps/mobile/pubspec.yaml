name: remotepc_ai
description: RemotePC AI mobile client — remote desktop, local AI chat and AI agent for your Windows PC.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.3
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.5.0
  file_picker: ^13.4.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  flutter_markdown_plus: ^1.0.12
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: false
